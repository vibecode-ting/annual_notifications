name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print environment info
        run: |
          node -v
          npm -v
          echo "Listing root lockfiles:"
          ls -la | grep -E 'package-lock.json|yarn.lock|pnpm-lock.yaml|bun.lock' || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify .env presence
        run: |
          if [ -f .env ]; then
            echo ".env found in repo — proceeding with build using committed env (user accepted risk)."
          else
            echo "Warning: .env not found in repository. Build may fail."
          fi

      - name: Build (capture output)
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Build failed; see build.log"
            exit 1
          fi
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

