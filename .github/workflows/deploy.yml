name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Print environment info
        run: |
          node -v
          npm -v
          echo "Listing root lockfiles:"
          ls -la | grep -E 'package-lock.json|yarn.lock|pnpm-lock.yaml|bun.lock' || true

      - name: Install dependencies
        run: npm install

      - name: Verify .env presence
        run: |
          if [ -f .env ]; then
            echo ".env found in repo — proceeding with build using committed env (user accepted risk)."
          else
            echo "Warning: .env not found in repository. Build may fail."
          fi

      - name: Build (capture output)
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Build failed; see build.log"
            exit 1
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
