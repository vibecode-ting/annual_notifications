name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Print Node & NPM versions
        run: |
          node -v
          npm -v
          echo "Listing lockfiles in repo root:"
          ls -la | grep -E 'package-lock.json|yarn.lock|pnpm-lock.yaml|bun.lock' || true

      - name: Install dependencies (use npm install because package-lock.json may be missing)
        run: npm install

      - name: Verify .env presence
        run: |
          if [ -f .env ]; then
            echo ".env found in repo — proceeding with build using committed env (user accepted risk)."
          else
            echo "Warning: .env not found in repository. Build may fail."
          fi

      - name: Build (capture output)
        env:
          NODE_ENV: production
        run: |
          # capture stdout+stderr to build.log while still returning non-zero exit code on failure
          set -o pipefail
          npm run build 2>&1 | tee build.log
          # fail the step if build failed
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Build failed; see build.log"
            exit 1
          fi

      - name: Upload build log artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact (dist)
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
